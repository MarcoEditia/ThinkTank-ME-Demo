services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      # the LLM server
      - LLM_API_URL=http://host.docker.internal:8000
      - LLM_MODEL=qwen3.5-9b
    extra_hosts:
      # lets the container talk to the host machine's port 8000
      - "host.docker.internal:host-gateway"
    volumes:
      # Saves the SQLite database permanently to a folder named 'sqlite_data'
      - ./sqlite_data:/app/data
      # Saves the files to a folder named 'media'
      - ./media:/app/media